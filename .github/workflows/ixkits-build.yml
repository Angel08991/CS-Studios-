name: Build IxKits

on:
  push:
    branches: [main]
    paths:
      - 'IxKits/**'
      - '.github/workflows/ixkits-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'IxKits/**'
      - '.github/workflows/ixkits-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile plugin JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile IxKits
        run: gradle --no-daemon -p IxKits clean build

      - name: Set up Node.js for catalog checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test community catalog API
        run: npm test --prefix IxKits/catalog-service

      - name: Verify JAR exists
        run: test -s IxKits/build/libs/IxKits-0.1.0.jar

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: IxKits-JAR
          path: IxKits/build/libs/IxKits-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: IxKits-Source
          path: IxKits
          if-no-files-found: error
          retention-days: 30
