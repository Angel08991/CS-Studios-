name: Build CS ResourceHub APK

on:
  push:
    branches:
      - cs-resourcehub-android
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs-resourcehub-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f CS-ResourceHub/app/build.gradle.kts ]; then
            test -d .build-source
            cat .build-source/part*.b64 | base64 --decode > /tmp/csrh-partial.zip
            python3 - <<'PY'
          import pathlib, struct, zipfile, zlib
          raw = pathlib.Path("/tmp/csrh-partial.zip").read_bytes()
          rebuilt = pathlib.Path("/tmp/csrh-recovered.zip")
          pos = 0
          count = 0
          with zipfile.ZipFile(rebuilt, "w", compression=zipfile.ZIP_DEFLATED) as out:
              while pos + 30 <= len(raw) and raw[pos:pos+4] == b"PK\x03\x04":
                  values = struct.unpack_from("<IHHHHHIIIHH", raw, pos)
                  flags, method, crc, csize, usize, nlen, xlen = values[2], values[3], values[6], values[7], values[8], values[9], values[10]
                  if flags & 0x08:
                      raise RuntimeError("Unexpected ZIP data descriptor; cannot safely recover this entry")
                  name_start = pos + 30
                  name = raw[name_start:name_start+nlen].decode("utf-8")
                  data_start = name_start + nlen + xlen
                  data_end = data_start + csize
                  if data_end > len(raw):
                      break
                  compressed = raw[data_start:data_end]
                  if method == 0:
                      payload = compressed
                  elif method == 8:
                      payload = zlib.decompress(compressed, -15)
                  else:
                      raise RuntimeError(f"Unsupported ZIP compression method {method}: {name}")
                  if len(payload) != usize:
                      raise RuntimeError(f"Size check failed for {name}")
                  entry = zipfile.ZipInfo(name)
                  entry.compress_type = zipfile.ZIP_DEFLATED
                  out.writestr(entry, payload)
                  pos = data_end
                  count += 1
          if count < 35:
              raise RuntimeError(f"Recovered only {count} project entries")
          with zipfile.ZipFile(rebuilt) as check:
              bad = check.testzip()
              if bad:
                  raise RuntimeError(f"Rebuilt ZIP validation failed at {bad}")
              check.extractall("CS-ResourceHub")
          print(f"Recovered and validated {count} project entries.")
          PY
          fi
          test -f CS-ResourceHub/app/build.gradle.kts
          test -f CS-ResourceHub/app/src/main/AndroidManifest.xml
          test -f CS-ResourceHub/app/src/main/java/com/csstudios/resourcehub/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK packages
        shell: bash
        run: |
          set -eu
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          cd CS-ResourceHub
          gradle --no-daemon clean assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/CS-ResourceHub.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS-ResourceHub-APK
          path: dist/CS-ResourceHub.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release on manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cs-resourcehub-apk-${{ github.run_number }}
          name: CS ResourceHub APK build ${{ github.run_number }}
          body: |
            APK Android de CS ResourceHub by CS Studios.
            Es una compilación de depuración; las funciones online necesitan configurar Supabase.
          files: dist/CS-ResourceHub.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save normal source files in the branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .build-source ]; then
            rm -rf .build-source
            git add -A -- CS-ResourceHub .build-source
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Add CS ResourceHub Android and backend source"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
