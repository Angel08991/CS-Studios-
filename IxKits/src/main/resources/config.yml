# IxKits - Server configuration
# Interface language: es (Spanish) or en (English).
language: es

settings:
  autosave-on-editor-close: true
  project-format-version: 2
  community-catalog-enabled: false

# Project claiming. By default, every player can claim a project.
# Set permission to a permission node (for example ixkits.claim) to restrict it.
# cooldown-seconds applies per player across all projects; 0 disables the cooldown.
claim:
  enabled: true
  permission: ""
  cooldown-seconds: 0

# Optional online catalog. Keep disabled until the API is deployed.
catalog:
  enabled: false
  base-url: ""
  publish-token: ""
  interaction-token: ""
  minecraft-version: "1.21.11"
  default-license: "all-rights-reserved"

# Item abilities. Every power is activated per item in the Special Abilities GUI.
abilities:
  tnt-on-hit-cooldown-ms: 3000
  tnt-on-hit-fuse-ticks: 40
  tnt-on-hit-yield: 2.0
  lightning-on-hit-cooldown-ms: 5000
  lifesteal-on-hit-cooldown-ms: 1000
  lifesteal-on-hit-percent: 0.25
  poison-on-hit-cooldown-ms: 4500
  poison-on-hit-duration-ticks: 60
  poison-on-hit-amplifier: 0
  frost-on-hit-cooldown-ms: 3000
  frost-on-hit-duration-ticks: 40
  frost-on-hit-amplifier: 1
  flame-on-hit-cooldown-ms: 3500
  flame-on-hit-duration-ticks: 80
  knockback-on-hit-cooldown-ms: 2500
  knockback-on-hit-strength: 1.25
  knockback-on-hit-y: 0.35

# MiniMessage format strings used by dynamic lore placeholders.
# Put {enchantments} or {abilities} alone on a lore template line to expand it.
# Supported enchantment placeholders: {name}, {level}, {key}.
# Supported ability placeholders: {name}, {cooldown}, {key}.
# Lore preview length and dynamic line formatting.
# Supports MiniMessage plus legacy & / § codes and per-character hex such as:
# "&#F2FF00&lU&#F4F300&lS&#F6E800&lU&#F9DC00&lA&#FBD000&lR&#FDC500&lI&#FFB900&lO"
lore:
  template-preview-lines: 5
  enchantment-line-format: "<#FBBF24>⚔ <#D1D5DB>{name} <#FDE68A>{level}"
  ability-line-format: "<#F87171>✦ <#FECACA>{name} <#9CA3AF>({cooldown})"
